apis:
- name: Open Charge Map POI API
  description: >
    Primary REST API for searching and retrieving EV charging station data (Points of Interest) from the
    Open Charge Map global registry. Supports geographic search by latitude/longitude with distance radius,
    bounding box filtering, country filtering, and filtering by operator, connection type, charging level,
    usage type, and operational status. Returns full POI data including address, equipment details, connection
    types, power levels, operator info, and user comments. Supports compact and verbose output formats
    in JSON. An API key is required and passed as a query parameter or HTTP header.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://openchargemap.org/site/develop/api
  baseURL: https://api.openchargemap.io/v3
  tags:
  - EV Charging
  - Points of Interest
  - Geospatial Search
  - Charging Stations
  properties:
  - type: Documentation
    url: https://openchargemap.org/site/develop/api
  - type: GitHub
    url: https://github.com/openchargemap/ocm-system
- name: Open Charge Map Reference Data API
  description: >
    REST API endpoint returning core reference data used for interpreting POI results, including connection
    types, charging levels, operators, countries, status types, usage types, supply types (AC/DC), and
    submission status types. This data provides the lookup tables needed to decode numeric ID fields returned
    in POI results. Can be filtered by country. Returns reference data in JSON format with an API key.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://openchargemap.org/site/develop/api
  baseURL: https://api.openchargemap.io/v3
  tags:
  - Reference Data
  - Connection Types
  - Operators
  - Countries
  properties:
  - type: Documentation
    url: https://openchargemap.org/site/develop/api
- name: Open Charge Map POI Submit API
  description: >
    REST API endpoint for contributing new EV charging station data or updating existing POI records in
    the Open Charge Map global registry. Requires an authenticated API key associated with a registered
    Open Charge Map user account. Submitted data is reviewed and integrated into the community dataset.
    Supports adding new charging locations with full address, equipment, connection type, and operator
    details.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://openchargemap.org/site/develop/api
  baseURL: https://api.openchargemap.io/v3
  tags:
  - Submit
  - Contribute
  - Crowdsourced
  - Data Entry
  properties:
  - type: Documentation
    url: https://openchargemap.org/site/develop/api
